name: Android
on:
  push:
    branches: [main]
    paths: ['android/**']
    tags: ['v*']
  pull_request:
    paths: ['android/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      # Проверочная сборка без ключа (PR и обычные коммиты)
      - name: Debug build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: gradle assembleDebug --no-daemon -PrepoSlug=${{ github.repository }}

      # Релиз: подписанный APK, ключ из GitHub Secrets, один и тот же для всех версий
      - name: Decode keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Release build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon -PrepoSlug=${{ github.repository }}
      - name: Rename APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "proshivki-${{ github.ref_name }}.apk"
      - uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          files: proshivki-${{ github.ref_name }}.apk
          generate_release_notes: true

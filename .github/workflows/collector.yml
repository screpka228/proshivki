name: Weekly collector
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install
      - run: pip install -r tools/collector/requirements.txt
      - name: Run collector
        working-directory: tools/collector
        env:
          # Необязательно: без ключа шаг нейросети пропускается без ошибки
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m collector --sources all --limit 200 | tee "$RUNNER_TEMP/summary.txt"
      - name: PR body
        run: |
          { echo "Автоматический запуск сборщика. Проверьте diff перед слиянием."; echo; echo '```'; tail -n 5 "$RUNNER_TEMP/summary.txt"; echo '```'; } > "$RUNNER_TEMP/body.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: collector/weekly
          title: 'Сборщик: обновление базы'
          commit-message: 'data: обновление сборщиком'
          body-path: ${{ runner.temp }}/body.md
          add-paths: |
            data/devices
            data/index.json
